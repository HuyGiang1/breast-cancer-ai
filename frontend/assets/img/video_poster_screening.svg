<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="vidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#vidBg)"/>
  <rect width="960" height="540" rx="16" fill="url(#centerGlow)"/>

  <!-- Subtle Medical Abstract Wave -->
  <path d="M 0 320 Q 240 220 480 340 T 960 260 L 960 540 L 0 540 Z" fill="#0f766e" fill-opacity="0.12"/>
  <path d="M 0 380 Q 240 290 480 400 T 960 340 L 960 540 L 0 540 Z" fill="#1e293b" fill-opacity="0.3"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(48, 48)">
    <rect x="0" y="0" width="180" height="30" rx="6" fill="#0f766e" fill-opacity="0.5" stroke="#14b8a6" stroke-width="1"/>
    <text x="14" y="20" fill="#ccfbf1" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">EDUCATIONAL VIDEO</text>
    
    <rect x="192" y="0" width="120" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="206" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">HD // 08:42</text>
  </g>

  <!-- Center Frosted-Glass Play Button -->
  <g transform="translate(480, 270)" filter="url(#glassShadow)" cursor="pointer" id="playBtnGroup">
    <circle cx="0" cy="0" r="54" fill="#0f172a" fill-opacity="0.8" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#14b8a6" stroke-width="1" stroke-dasharray="6 6" opacity="0.6"/>
    <!-- Triangle Play Icon -->
    <polygon points="-12,-20 22,0 -12,20" fill="#ffffff"/>
  </g>

  <!-- Video Title & Publisher Footer -->
  <g transform="translate(48, 420)">
    <text x="0" y="30" fill="#ffffff" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="24" font-weight="800">
      Understanding Digital Screening Mammography &amp; Assistive AI
    </text>
    <text x="0" y="60" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14">
      Curated Clinical Education · Peer-reviewed institution source will be connected during Phase 4 curation.
    </text>
  </g>
</svg>
