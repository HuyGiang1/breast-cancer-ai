<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cytoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="benignFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="maligFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#cytoBg)"/>

  <!-- Left: Typical Benign Nuclear Contour (Regular, smooth, uniform) -->
  <g transform="translate(180, 240)">
    <!-- Reference Grid Circle -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Benign Nuclear Envelope -->
    <path d="M 0 -85 C 50 -85, 88 -45, 85 0 C 82 48, 48 85, 0 85 C -48 85, -85 48, -85 0 C -85 -48, -48 -85, 0 -85 Z" fill="url(#benignFill)" stroke="#10b981" stroke-width="2.5"/>
    
    <!-- Nucleolus -->
    <circle cx="-15" cy="-10" r="14" fill="#047857" opacity="0.6"/>
    
    <!-- Measurement Callout: Radius Vector -->
    <line x1="0" y1="0" x2="60" y2="-60" stroke="#34d399" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="0" cy="0" r="3" fill="#34d399"/>
    <circle cx="60" cy="-60" r="3" fill="#34d399"/>
    <text x="20" y="-38" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="10">r_mean</text>

    <!-- Header Badge -->
    <rect x="-90" y="-160" width="180" height="28" rx="6" fill="#064e3b" stroke="#059669"/>
    <text x="0" y="-142" text-anchor="middle" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="11" font-weight="700">BENIGN NUCLEUS (SMOOTH)</text>
    <text x="0" y="125" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Low concavity · Regular perimeter</text>
  </g>

  <!-- Right: Typical Malignant Nuclear Contour (Pleomorphic, irregular, high concavity) -->
  <g transform="translate(600, 240)">
    <!-- Reference Grid Circle -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    
    <!-- Malignant Nuclear Envelope (Deep notches, high irregularity) -->
    <path d="M -10 -95 C 40 -115, 85 -60, 95 -20 C 105 20, 60 40, 75 75 C 90 110, 20 100, -25 90 C -70 80, -60 120, -95 70 C -130 20, -75 0, -80 -40 C -85 -80, -60 -75, -10 -95 Z" fill="url(#maligFill)" stroke="#f43f5e" stroke-width="2.5"/>
    
    <!-- Hyperchromatic Nucleoli -->
    <circle cx="-25" cy="-20" r="18" fill="#be123c" opacity="0.7"/>
    <circle cx="30" cy="25" r="13" fill="#be123c" opacity="0.6"/>

    <!-- Measurement Callout: Concave Point Notch -->
    <circle cx="68" cy="35" r="6" fill="none" stroke="#fda4af" stroke-width="2"/>
    <line x1="74" y1="35" x2="110" y2="35" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="115" y="39" fill="#fecdd3" font-family="'JetBrains Mono', monospace" font-size="10">concavity_worst</text>

    <!-- Header Badge -->
    <rect x="-100" y="-160" width="200" height="28" rx="6" fill="#881337" stroke="#e11d48"/>
    <text x="0" y="-142" text-anchor="middle" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="11" font-weight="700">MALIGNANT NUCLEUS (PLEOMORPHIC)</text>
    <text x="0" y="125" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">High indentation · High texture variance</text>
  </g>

  <!-- Divider & Subtitle -->
  <line x1="390" y1="80" x2="390" y2="420" stroke="#1e293b" stroke-width="2"/>
  <text x="390" y="470" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">WDBC 30-FEATURE CYTOMORPHOLOGICAL MAPPING (FNA DIGITAL IMAGE BASIS)</text>
</svg>
