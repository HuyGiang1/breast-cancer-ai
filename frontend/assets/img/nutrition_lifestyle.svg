<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="nutriCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#nutriCanvas)"/>

  <!-- Subtle Grid Accent -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Top Title & Provenance -->
  <g transform="translate(48, 44)">
    <rect x="0" y="0" width="280" height="26" rx="6" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-width="1"/>
    <text x="12" y="17" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">AICR EVIDENCE-BASED MODEL</text>
    <text x="0" y="58" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">The New American Plate Composition</text>
    <text x="0" y="82" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Proportion-based nutrition for survivorship and long-term metabolic health (AICR / WCRF)</text>
  </g>

  <!-- Plate Visual Representation (Center-Left) -->
  <g transform="translate(230, 290)" filter="url(#plateShadow)">
    <!-- Outer Rim -->
    <circle cx="0" cy="0" r="140" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Inner Dish -->
    <circle cx="0" cy="0" r="126" fill="#ffffff"/>

    <!-- 2/3 Section: Plant Foods (Vegetables, Fruits, Whole Grains, Beans) - 240 degrees -->
    <!-- Arc from -90 deg to 150 deg (240 deg total) -->
    <path d="M 0 0 L 0 -124 A 124 124 0 1 1 -107.38 62 Z" fill="#10b981" fill-opacity="0.85"/>

    <!-- 1/3 Section: Lean Protein (Fish, Poultry, Tofu) - 120 degrees -->
    <!-- Arc from 150 deg to 270 deg (120 deg total) -->
    <path d="M 0 0 L -107.38 62 A 124 124 0 0 1 0 -124 Z" fill="#3b82f6" fill-opacity="0.85"/>

    <!-- Division Lines -->
    <line x1="0" y1="0" x2="0" y2="-124" stroke="#ffffff" stroke-width="3"/>
    <line x1="0" y1="0" x2="-107.38" y2="62" stroke="#ffffff" stroke-width="3"/>

    <!-- Center Badge -->
    <circle cx="0" cy="0" r="28" fill="#0f172a"/>
    <text x="0" y="4" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800">AICR</text>

    <!-- Section Labels inside plate -->
    <text x="45" y="-30" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="800">≥ 2/3 Plant</text>
    <text x="45" y="-14" fill="#d1fae5" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Veg, fruit, whole grains</text>

    <text x="-65" y="-40" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="800">≤ 1/3</text>
    <text x="-65" y="-24" fill="#dbeafe" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Lean protein</text>
  </g>

  <!-- Right Legend & Pillar Cards -->
  <g transform="translate(420, 160)" font-family="'Inter', sans-serif">
    <!-- Pillar 1: Plant Foundation -->
    <g transform="translate(0, 0)">
      <rect width="330" height="74" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="10" fill="#065f46"/>
      <text x="28" y="32" text-anchor="middle" fill="#34d399" font-size="11" font-weight="800">2/3</text>
      <text x="48" y="30" fill="#f8fafc" font-size="13" font-weight="700">Plant-Forward Foundation</text>
      <text x="48" y="50" fill="#94a3b8" font-size="11">Cruciferous vegetables, berries, legumes &amp; oats rich in protective fiber &amp; polyphenols.</text>
    </g>

    <!-- Pillar 2: Lean Protein -->
    <g transform="translate(0, 86)">
      <rect width="330" height="74" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="10" fill="#1e3a8a"/>
      <text x="28" y="32" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="800">1/3</text>
      <text x="48" y="30" fill="#f8fafc" font-size="13" font-weight="700">Quality Lean Protein</text>
      <text x="48" y="50" fill="#94a3b8" font-size="11">Fish rich in omega-3s, poultry, beans &amp; tofu; limiting red &amp; processed meats.</text>
    </g>

    <!-- Pillar 3: Active Context & Hydration -->
    <g transform="translate(0, 172)">
      <rect width="330" height="74" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#64748b" stroke-width="1"/>
      <circle cx="28" cy="28" r="10" fill="#334155"/>
      <text x="28" y="32" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="800">💧</text>
      <text x="48" y="30" fill="#f8fafc" font-size="13" font-weight="700">Hydration &amp; Physical Activity</text>
      <text x="48" y="50" fill="#94a3b8" font-size="11">Water as primary beverage; 150–300 min/week moderate physical activity.</text>
    </g>
  </g>

  <!-- Bottom Sourced Note -->
  <g transform="translate(48, 468)" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">
    <text x="0" y="0">Source: American Institute for Cancer Research (AICR). Distinct from active chemotherapy nutrition managed by oncology dietitians.</text>
  </g>
</svg>
