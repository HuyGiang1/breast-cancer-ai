# ==============================================================================
# Breast Cancer AI — Production Docker Compose Configuration
# Usage:
#   docker compose -f docker-compose.production.yml up -d --build
# ==============================================================================

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: breast_cancer_api_prod
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_ENABLE_API_DOCS: "false"
      FINAL_ML_MODEL_PATH: /app/runtime_models/logistic_regression_final_seed42.joblib
      FINAL_DL_MODEL_PATH: /app/runtime_models/efficientnetb0_final_seed42.keras
      DL_PRELOAD_ON_STARTUP: "true"
      DATABASE_PATH: /app/backend/data/app.db
    # Security: Only expose port 8000 internally to the Docker bridge network.
    # NEVER bind port 8000 to the host interface in production!
    expose:
      - "8000"
    volumes:
      # Application database storage (Read-Write)
      - ./backend/data:/app/backend/data:rw
      # Database backups directory (Read-Write)
      - ./backend/backups:/app/backend/backups:rw
      # Model artifacts (Read-Only to prevent accidental tampering or corruption)
      - ./runtime_models:/app/runtime_models:ro
      # Dynamic diagnostic visualization results (Read-Write)
      - ./frontend/results:/app/frontend/results:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  web:
    image: nginx:1.27-alpine
    container_name: breast_cancer_web_prod
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Frontend static assets (Read-Only)
      - ./frontend:/usr/share/nginx/html:ro
      # Production Nginx configuration (Read-Only)
      - ./deploy/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS Certificates directory mounted from host (Read-Only)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Certbot ACME webroot challenge directory mounted from host (Read-Only)
      - ./certbot/www:/var/www/certbot:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
